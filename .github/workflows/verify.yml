name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc 3.11
        run: |
          curl -sSLo pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1
      - name: Install Quarto 1.10.18
        run: |
          curl -sSLo quarto.deb https://github.com/quarto-dev/quarto-cli/releases/download/v1.10.18/quarto-1.10.18-linux-amd64.deb
          sudo dpkg -i quarto.deb
          quarto --version
      - name: No em dashes outside originals
        run: |
          if grep -rIl $'\xe2\x80\x94' --exclude-dir=.git --exclude-dir=originals .; then
            echo "em dash found in the files above"; exit 1
          fi
      - name: Content unchanged
        run: |
          # Converted files open with front matter that names a source_file;
          # docs that merely show an example of it are skipped.
          files=$(for f in $(git ls-files '*.md'); do
            [ "$(head -1 "$f")" = "---" ] && sed -n '2,/^---$/p' "$f" | grep -q '^source_file:' && echo "$f"
          done || true)
          if [ -z "$files" ]; then echo "no converted files"; exit 0; fi
          python3 tools/check_unchanged.py $files
      - name: Sim tests
        run: |
          # Each sim ships its own no-dependency node test script.
          for t in sims/*/test-law.mjs sims/*/test.mjs; do
            [ -f "$t" ] || continue
            echo "== $t"; (cd "$(dirname "$t")" && node "$(basename "$t")")
          done
      - name: Site builds
        run: python3 tools/render.py --site
      - name: Quarto site builds
        # Fails on any Quarto warning line (docs/quarto-migration-plan.md).
        run: python3 tools/quarto_build.py
      - name: Tests
        # Each asserts a ruled DECISIONS.md quantity, or reads build/site or build/quarto-site.
        run: python3 -m unittest discover -s tests -v
      - name: Chrome contract against the Quarto build
        # Phase 2 exit (D-0042): the brand contract gates the Quarto build.
        env:
          SITE_DIR: build/quarto-site
        run: python3 -m unittest discover -s tests -p test_site_chrome.py -v
