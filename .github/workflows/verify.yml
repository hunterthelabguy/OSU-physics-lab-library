name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Quarto 1.10.18
        run: |
          curl -sSLo quarto.deb https://github.com/quarto-dev/quarto-cli/releases/download/v1.10.18/quarto-1.10.18-linux-amd64.deb
          sudo dpkg -i quarto.deb
          quarto --version
      - name: Use the Pandoc bundled with Quarto
        # D-0044, D-0045: every other step reads with the Pandoc the Quarto
        # pages render with, named as one binary path and never as the
        # `quarto pandoc` command (its stdout truncates). The binary is found
        # next to the resolved quarto executable, so it follows the Quarto pin.
        run: |
          bin=$(dirname "$(readlink -f "$(command -v quarto)")")
          found=$(find "$bin/tools" -type f -name pandoc -perm -100 2>/dev/null || true)
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one bundled pandoc under $bin/tools, found:"
            echo "$found"
            exit 1
          fi
          "$found" --version | head -1
          echo "PANDOC=$found" >> "$GITHUB_ENV"
      - name: No em dashes in published sources
        # Only what publishes to students and the public (2026-10-03 ruling);
        # a converted file keeps its original's (D-0103). The list is in the
        # script, which tests/test_question_ids.py runs on a fixture.
        run: python3 tools/check_em_dash.py
      - name: Install pdftotext (PDF original, PDF download tests)
        # Not on the runner images. The word check reads a PDF original's
        # text with it (D-0160), so it comes before that step;
        # tests/test_downloads.py reads the PDFs with it too. The PDFs
        # themselves use the runner's google-chrome, which
        # tools/downloads.py finds or fails on (LEDGER 53).
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v 2>&1 | head -1
      - name: Content unchanged
        run: |
          # Converted files open with front matter that names a source_file;
          # docs that merely show an example of it are skipped. The word
          # check, then Word's labels (D-0102, D-0112).
          files=$(for f in $(git ls-files '*.md'); do
            [ "$(head -1 "$f")" = "---" ] && sed -n '2,/^---$/p' "$f" | grep -q '^source_file:' && echo "$f"
          done || true)
          if [ -z "$files" ]; then echo "no converted files"; exit 0; fi
          python3 tools/check_unchanged.py $files
          python3 tools/check_numbers.py $files
      - name: Sim tests
        run: |
          # Each sim ships its own no-dependency node test script.
          for t in sims/*/test-law.mjs sims/*/test.mjs; do
            [ -f "$t" ] || continue
            echo "== $t"; (cd "$(dirname "$t")" && node "$(basename "$t")")
          done
      - name: Quarto site builds
        # Fails on any Quarto warning line (docs/quarto-migration-plan.md).
        run: python3 tools/quarto_build.py
      - name: Tests
        # Each asserts a ruled DECISIONS.md quantity, or reads build/quarto-site.
        # The brand contract, test_site_chrome.py, is among them (D-0042, D-0061).
        run: python3 -m unittest discover -s tests -v
      - name: Hand the tested folder to deploy
        # D-0048: deploy ships exactly these bytes, never a rebuild. The path
        # is _quarto.yml's output-dir (tests/test_deploy_workflow.py).
        # D-0187: kept 7 days, not GitHub's 90; deploy reads it within minutes.
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site
          path: build/quarto-site
          if-no-files-found: error
          retention-days: 7

  deploy:
    # D-0047, D-0048: Cloudflare Pages, Direct Upload. A push to main is
    # production; a pull request from this repository is a preview; a fork's
    # pull request deploys nothing. The only job that names the secrets.
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the deploy check only
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools/check_deployed.py
          sparse-checkout-cone-mode: false
      - name: The tested folder
        uses: actions/download-artifact@v4
        with:
          name: quarto-site
          path: build/quarto-site
      - name: Deploy to Cloudflare Pages
        # Wrangler pinned exactly and run directly, no third-party action on
        # the token's path (call 5). The project name is a repository
        # variable, so the interim name changes without a code change. The
        # branch name is attacker-chosen text: it reaches the shell only
        # through env, never pasted into the script.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          test -n "$PROJECT" || { echo "repository variable CLOUDFLARE_PAGES_PROJECT is not set"; exit 1; }
          npx --yes wrangler@4.146.0 pages deploy build/quarto-site --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$COMMIT" --commit-dirty=true
          url=$(python3 -c 'import json, os, sys
          rows = [json.loads(l) for l in open(os.environ["WRANGLER_OUTPUT_FILE_PATH"]) if l.strip()]
          urls = [r["url"] for r in rows if r.get("type") == "pages-deploy-detailed" and r.get("url")]
          sys.exit("wrangler reported no deployment URL") if not urls else print(urls[-1])')
          echo "Deployed to $url"
          echo "URL=$url" >> "$GITHUB_ENV"
      - name: The deployment serves the tested bytes
        # D-0049: every file byte for byte, unknown paths 404 with the 404
        # page, robots.txt and noindex present, against the live URL.
        run: python3 tools/check_deployed.py build/quarto-site "$URL"
      - name: Production serves the tested bytes at its alias
        # D-0050: a push to main must change what the project's own address
        # serves, not only the deployment's URL. A production branch other
        # than main would leave the alias on older bytes and fail here.
        # D-0060: the alias can serve the previous deployment for seconds
        # after "Deployment complete", so this step alone reruns the whole
        # check every 5 s until one complete run passes, for up to 120 s.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: python3 tools/check_deployed.py build/quarto-site "https://$PROJECT.pages.dev/" --wait 120
